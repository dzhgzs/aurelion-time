name: 🐛 Bug 反馈
description: 报告功能异常或错误表现
labels: ["bug"]
body:
  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开…
        2. 点击…
        3. 期望 X，实际 Y
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 应用版本
      placeholder: "1.3.0（托盘 tooltip / 安装包文件名可见）"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: 操作系统
      placeholder: "Windows 11 23H2 / Windows 10 21H2 / macOS 14"
  - type: textarea
    id: log
    attributes:
      label: crash.log 片段（如有）
      description: 打包版位于 %APPDATA%\AURELION 时光\crash.log，可直接粘贴相关行
  - type: textarea
    id: extra
    attributes:
      label: 补充说明
      description: 截图、智能输入的期望/实际解析结果等
