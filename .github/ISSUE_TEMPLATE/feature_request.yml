name: ✨ 功能建议
description: 提出新功能或改进想法
labels: ["enhancement"]
body:
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 什么情况下需要这个功能？解决什么问题？
    validations:
      required: true
  - type: textarea
    id: detail
    attributes:
      label: 期望表现
      description: 智能输入类建议请附「输入 → 期望解析结果」示例
  - type: textarea
    id: alternative
    attributes:
      label: 现有替代方案
      description: 目前你如何绕过这个限制
