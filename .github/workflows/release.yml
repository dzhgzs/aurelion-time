name: Release

# 推送 v* 标签自动构建 Windows 三形态并发布 Release；
# 也可在 Actions 页面手动触发（仅构建，不发布）。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build portable + installer
        run: npx electron-builder --win portable nsis --x64 -p never

      - name: Build green edition zip
        run: npx electron-builder --win zip --x64 -p never

      - name: Rename green edition
        shell: pwsh
        run: |
          $z = Get-ChildItem release -Filter "*-win.zip" | Select-Object -First 1
          if ($z) { Move-Item $z.FullName "release/AURELION-Time-Green.zip" -Force }

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release delete $tag --yes 2>$null
          gh release create $tag --generate-notes
          Start-Sleep -Seconds 30
          $releaseId = (gh release view $tag --json databaseId --jq '.databaseId').Trim()
          Write-Host "releaseId=$releaseId"
          $items = @(
            @{ file = "release/AURELION-Time-Portable.exe"; name = "AURELION-Time-Portable.exe" },
            @{ file = "release/AURELION-Time-Setup.exe"; name = "AURELION-Time-Setup.exe" },
            @{ file = "release/AURELION-Time-Green.zip"; name = "AURELION-Time-Green.zip" }
          )
          foreach ($it in $items) {
            $ok = $false
            for ($i = 1; $i -le 5 -and -not $ok; $i++) {
              Write-Host "uploading $($it.name) attempt $i ..."
              $code = curl.exe -sS -f -L -o NUL -w "%{http_code}" -X POST -H "Authorization: Bearer $env:GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" -H "Content-Type: application/octet-stream" --data-binary "@$($it.file)" "https://uploads.github.com/repos/$env:GITHUB_REPOSITORY/releases/$releaseId/assets?name=$($it.name)"
              Write-Host "http_code=$code"
              if ($code -eq "201") { $ok = $true } else { Start-Sleep -Seconds 20 }
            }
            if (-not $ok) { Write-Error "Failed to upload $($it.name)"; exit 1 }
          }

  # macOS 包必须在 macOS runner 上构建；等待 Windows 构建完成后上传同一 Release
  build-mac:
    runs-on: macos-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build macOS universal zip
        run: npx electron-builder --mac zip --universal -p never

      - name: Upload macOS asset to Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_name }}"
          releaseId=$(gh release view "$tag" --json databaseId --jq '.databaseId')
          file="release/AURELION-Time-macOS.zip"
          for i in 1 2 3 4 5; do
            code=$(curl -sS -f -L -o /dev/null -w "%{http_code}" -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$file" \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$releaseId/assets?name=AURELION-Time-macOS.zip")
            echo "http_code=$code"
            if [ "$code" = "201" ]; then break; fi
            sleep 20
          done
          if [ "$code" != "201" ]; then echo "Failed to upload macOS asset"; exit 1; fi
